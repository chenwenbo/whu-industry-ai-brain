<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据资产 · 武汉大学产业创新AI智脑平台</title>
<link rel="stylesheet" href="assets/css/theme.css">
<style>.ecard.active{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary),var(--glow)}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="assets/js/lucide.min.js"></script>
</head>
<body data-theme="dark" data-page="data-foundation">
<main class="wuda-view">
  <div class="page-head">
    <div><div class="page-title"><span class="accentbar"></span>数据资产</div>
      <div class="page-sub">高校产业数据资产盘点 · 几类数据资产举证 · 点击资产卡在下方查看明细</div></div>
    <div style="display:flex;gap:9px">
      <a class="btn btn-sm" href="data-catalog.html"><i data-lucide="library"></i> 数据资产目录</a>
      <button class="btn btn-sm btn-primary" id="btnReport"><i data-lucide="file-down"></i> 导出资产盘点</button>
    </div>
  </div>

  <!-- 业务向：几类数据资产举证（点卡片在下方展示明细） -->
  <div class="panel mt-2">
    <div class="panel-h"><div class="t"><span class="bar"></span>数据资产盘点 · 几类数据资产举证</div>
      <div class="tools"><span class="panel-tag">点击资产卡在下方查看明细</span></div></div>
    <div class="grid cols-5 stagger" id="inventoryGrid"></div>
  </div>

  <!-- 资产明细（全宽展示，替代侧边栏抽屉） -->
  <div class="panel mt-4" id="detailPanel">
    <div class="panel-h"><div class="t"><span class="bar"></span><span id="detailTitle">资产明细</span></div>
      <div class="tools"><span class="panel-tag" id="detailHint">点击上方资产卡查看明细</span></div></div>
    <div id="detailArea"></div>
  </div>

  <div id="srcNote"></div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/shell.js"></script>
<script>(function(){
  const INV=DB.assetInventory, DR=DB.inventoryDrill;

  // ---- 业务向资产盘点卡片（替代原数据表总数/数据总量/同步任务等技术指标）----
  document.getElementById('inventoryGrid').innerHTML=INV.map(it=>`
    <div class="ecard" data-key="${it.key}" style="cursor:pointer">
      <div class="flex items-center gap-3">
        <span style="width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:${it.dom}22;color:${it.dom}"><i data-lucide="${it.icon}"></i></span>
        <div style="min-width:0">
          <div class="num fw7" style="font-size:23px;line-height:1.1">${it.value}<span class="f12 text-mute" style="margin-left:3px">${it.unit}</span></div>
          <div class="f13 fw6">${it.label}</div>
        </div>
      </div>
      <div class="f12 text-mute mt-2" style="line-height:1.45">${it.sub}</div>
    </div>`).join('');
  document.querySelectorAll('#inventoryGrid .ecard').forEach(c=>c.onclick=()=>openInventory(c.dataset.key));

  function openInventory(key){
    const it=INV.find(x=>x.key===key);
    let body=`<div class="flex items-center gap-3 mb-4">
      <span style="width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:${it.dom}22;color:${it.dom}"><i data-lucide="${it.icon}"></i></span>
      <div><div class="fw7 f18">${it.label}</div><div class="text-dim f13">${it.sub}</div></div>
      <div style="margin-left:auto" class="num fw7 text-primary" style="font-size:22px">${it.value} ${it.unit}</div></div>
      <div class="divider"></div>`;
    if(key==='hprojects'){
      body+=`<div class="fw6 mb-3"><i data-lucide="handshake"></i> 横向项目明细（年份 / 签约方 / 合同 / 金额）</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>年份</th><th>项目名称</th><th>签约方</th><th>合同类型</th><th>金额(万元)</th><th>承担学院</th></tr></thead><tbody>
        ${DR.hprojects.map(r=>`<tr><td class="num">${r.year}</td><td class="fw6">${r.name}</td><td>${r.partner}</td><td class="text-dim">${r.contract}</td><td class="num text-primary fw7">${r.amount.toLocaleString()}</td><td class="f12 text-mute">${r.college}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(key==='vproject'||key==='vprojects'){
      body+=`<div class="fw6 mb-3"><i data-lucide="flag"></i> 纵向项目明细（年份 / 来源 / 金额 / 负责人）</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>年份</th><th>项目名称</th><th>项目来源</th><th>经费(万元)</th><th>负责人</th></tr></thead><tbody>
        ${DR.vprojects.map(r=>`<tr><td class="num">${r.year}</td><td class="fw6">${r.name}</td><td>${UI.tag(r.source,'blue')}</td><td class="num text-primary fw7">${r.amount.toLocaleString()}</td><td>${r.pi}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(key==='patent'){
      const byType={};DB.patents.forEach(p=>byType[p.type]=(byType[p.type]||0)+1);
      body+=`<div class="grid cols-3" style="gap:9px">
        ${Object.keys(byType).map(t=>`<div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px"><div class="f12 text-mute">${t}</div><div class="fw7 num mt-2" style="font-size:20px">${byType[t]} 件</div></div>`).join('')}
        </div>
        <div class="divider"></div>
        <div class="fw6 mb-3"><i data-lucide="file-badge"></i> 专利明细（与成果打通）</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>专利号</th><th>名称</th><th>类型</th><th>状态</th><th>归属成果</th></tr></thead><tbody>
        ${DB.patents.slice(0,12).map(p=>`<tr><td class="num f12">${p.no}</td><td class="fw6">${p.title}</td><td>${UI.tag(p.type,p.type==='发明专利'?'purple':p.type==='PCT国际专利'?'blue':'gray')}</td><td>${UI.tag(p.status,p.status==='已授权'?'green':'amber')}</td><td class="f12 text-mute">${p.achTitle.slice(0,14)}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(key==='paper'){
      body+=`<div class="fw6 mb-3"><i data-lucide="book-open"></i> 论文资产（存量 / 新增 / 顶刊）</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>类别</th><th>数量</th><th>范围</th></tr></thead><tbody>
        ${DR.papers.map(r=>`<tr><td class="fw6">${r.tier}</td><td class="num text-primary fw7">${r.cnt.toLocaleString()}</td><td class="text-dim">${r.disc}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(key==='talent'){
      body+=`<div class="fw6 mb-3"><i data-lucide="award"></i> 高层次人才（长江/杰青等）</div>
        <div class="grid cols-2" style="gap:9px">${DR.talents.map(r=>`<div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 12px" class="flex items-center justify-between"><span class="fw6">${r.type}</span><span class="num text-primary fw7" style="font-size:20px">${r.cnt} 人</span></div>`).join('')}</div>`;
    } else if(key==='platform'){
      body+=`<div class="fw6 mb-3"><i data-lucide="beaker"></i> 国家级创新平台（国家重点实验室）</div>
        <div style="display:flex;flex-direction:column;gap:8px">${DR.platforms.map(r=>`<div class="flex items-center justify-between" style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px"><span class="fw6 f13">${r.name}</span>${UI.tag(r.disc,'blue')}</div>`).join('')}</div>`;
    } else if(key==='institute'){
      body+=`<div class="fw6 mb-3"><i data-lucide="landmark"></i> 研究院平台（含各地异地研究院）</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>名称</th><th>类型</th><th>出租率/入驻</th><th>企业数</th></tr></thead><tbody>
        ${DR.institutes.map(r=>`<tr><td class="fw6">${r.name}</td><td>${UI.tag(r.type||'研究院','gray')}</td><td class="num">${(r.occupancy||'-')}%</td><td class="num text-primary">${r.ents||'-'}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(key==='discipline'){
      body+=`<div class="fw6 mb-3"><i data-lucide="layers"></i> 五大优势学科</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>学科</th><th>支撑学院</th><th>团队数</th><th>可转化成果</th></tr></thead><tbody>
        ${DR.disciplines.map(r=>`<tr><td class="fw6">${r.name}</td><td class="f12 text-mute">${r.col}</td><td class="num">${r.teams}</td><td class="num text-primary">${r.ach}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(key==='achievement'){
      body+=`<div class="fw6 mb-3"><i data-lucide="lightbulb"></i> 可转化成果（老师团队自研项目，已与专利打通）</div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>成果</th><th>学科</th><th>负责人</th><th>TRL</th><th>专利</th><th>估值(万)</th><th>状态</th></tr></thead><tbody>
        ${DB.achievements.slice(0,12).map(a=>`<tr><td class="fw6">${a.title}</td><td>${a.disciplineName}</td><td>${a.leader}</td><td class="num">${a.trl}</td><td class="num text-primary">${a.patents}</td><td class="num">${a.value.toLocaleString()}</td><td>${UI.tag(a.status,'blue')}</td></tr>`).join('')}
        </tbody></table></div>`;
    } else if(key==='alumniEnt'){
      body+=`<div class="card-note" style="background:var(--warning)18;border:1px solid var(--warning);border-radius:10px;padding:12px 14px;color:var(--warning)">
        <i data-lucide="info"></i> 校友企业数据<b>待校友会统筹</b>：出思路、数据落地难，当前为统计估值，明细数据治理中。</div>`;
    } else {
      body+=`<div class="text-mute f13">该项资产为汇总统计，逐层钻取明细将在对应业务页（如企业管理 / 园区管理 / 创新成果）中展开查看。</div>`;
    }
    document.getElementById('detailTitle').textContent=it.label+' · 资产明细';
    document.getElementById('detailHint').textContent='当前查看：'+it.label;
    document.getElementById('detailArea').innerHTML=body;
    document.querySelectorAll('#inventoryGrid .ecard').forEach(c=>c.classList.toggle('active',c.dataset.key===key));
    if(window.refreshIcons)refreshIcons();
  }
  // 默认展示第一类资产明细
  if(INV.length)openInventory(INV[0].key);

  // ---- 交互 ----
  document.getElementById('btnReport').onclick=()=>UI.toast('已生成《高校产业数据资产盘点报告》（'+INV.length+' 类资产）','ok');

  document.getElementById('srcNote').innerHTML=UI.srcNote(['成果与专利','学院与团队','参股企业和校属企业','创业园/园区']);
})();</script>
</body></html>
