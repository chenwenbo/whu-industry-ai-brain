<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三大AI智能体 · 武汉大学产业创新AI智脑平台</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  /* 单列居中 · 典型智能体对话 UI */
  .chat-wrap{max-width:880px;margin:0 auto}
  /* 顶部:三大智能体分段切换 */
  .agent-seg{display:flex;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:14px;box-shadow:var(--glow-soft)}
  .seg-pill{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.18s;color:var(--text-dim);font-weight:600;font-size:13.5px;border:1px solid transparent}
  .seg-pill:hover{color:var(--text);background:var(--panel-2)}
  .seg-pill.on{color:var(--text);background:color-mix(in srgb,var(--seg) 12%,var(--panel));border-color:var(--seg);box-shadow:0 0 0 1px var(--seg)}
  .seg-pill .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:14px}
  .seg-pill .ic i{width:15px;height:15px}
  /* 大对话框 —— 页面主体 */
  .chat-box{display:flex;flex-direction:column;height:calc(100vh - 248px);min-height:540px}
  .chat-scroll{flex:1;overflow-y:auto;padding:6px 8px 6px 2px}
  .msg{display:flex;gap:10px;margin-bottom:18px;align-items:flex-start}
  .msg .av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .msg .av i{width:17px;height:17px}
  .bubble{border-radius:13px;padding:13px 15px;font-size:13.5px;line-height:1.75;max-width:90%}
  .msg.me{flex-direction:row-reverse}
  .msg.me .bubble{background:linear-gradient(120deg,var(--primary),var(--accent));color:var(--on-brand);font-weight:500}
  .msg.ai .bubble{background:var(--panel-2);border:1px solid var(--border)}
  .msg.ai .av{background:color-mix(in srgb,var(--accent) 18%,transparent)}
  .msg.me .av{background:color-mix(in srgb,var(--primary) 22%,transparent)}
  .gen-out{font-size:13.5px;line-height:1.8;color:var(--text)}
  .gen-out b{color:var(--primary)}
  /* 气泡内:交付 meta + 消息操作栏 */
  .deliver-meta{margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;color:var(--text-mute);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .deliver-meta i{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
  .msg-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .msg-act{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--text-dim);background:var(--panel);display:inline-flex;align-items:center;gap:5px;transition:.16s}
  .msg-act:hover{border-color:var(--primary);color:var(--text)}
  .msg-act i{width:13px;height:13px}
  /* 输入框 */
  .composer{border:1px solid var(--border-strong);border-radius:16px;padding:12px 14px;background:var(--panel);margin-top:12px;transition:.16s}
  .composer:focus-within{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary),var(--glow)}
  .composer textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;resize:none;outline:none;font-family:inherit;min-height:52px}
  .composer textarea::placeholder{color:var(--text-mute)}
  /* 演示场景 chip(输入框上方) */
  .scene-chip{font-size:12.5px;border:1px solid var(--border-strong);border-radius:20px;padding:6px 13px;cursor:pointer;color:var(--text-dim);transition:.16s;background:var(--panel);display:inline-flex;align-items:center;gap:6px}
  .scene-chip:hover{border-color:var(--primary);color:var(--text);background:color-mix(in srgb,var(--primary) 8%,var(--panel))}
  .scene-chip i{width:14px;height:14px}
  /* 场景库抽屉沿用 */
  .scene-side{font-size:12px;border:1px dashed var(--border-strong);border-radius:9px;padding:8px 10px;cursor:pointer;color:var(--text-dim);transition:.16s;margin-bottom:7px;line-height:1.5}
  .scene-side:hover{border-color:var(--primary);color:var(--text);border-style:solid}
  /* 欢迎 / 空状态 */
  .welcome{padding:10px 4px 6px;max-width:780px;margin:0 auto}
  .welcome .wc-top{text-align:center;margin-bottom:6px}
  .welcome .wc-ava{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:30px;margin:6px auto 14px}
  .welcome .wc-ava i{width:30px;height:30px}
  .welcome .wc-sum{font-size:20px;font-weight:800;margin-bottom:8px}
  .welcome .wc-desc{font-size:13px;color:var(--text-dim);line-height:1.7;max-width:600px;margin:0 auto}
  .wc-label{font-size:12px;color:var(--text-mute);letter-spacing:1px;margin:22px 0 11px;display:flex;align-items:center;gap:7px}
  .wc-label::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--primary)}
  /* 热门提示词 */
  .hot-rail{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .hot-chip{font-size:12.5px;border:1px solid var(--border-strong);border-radius:20px;padding:7px 14px;cursor:pointer;color:var(--text-dim);background:var(--panel);display:inline-flex;align-items:center;gap:7px;transition:.16s}
  .hot-chip:hover{border-color:var(--primary);color:var(--text);transform:translateY(-1px);box-shadow:var(--glow-soft)}
  .hot-chip .fire{color:#ff7a3c;width:14px;height:14px}
  .hot-chip .who{font-size:11px;color:var(--text-mute)}
  /* 推荐场景(按智能体分组) */
  .scene-group{margin-bottom:6px}
  .sg-head{display:flex;align-items:center;gap:9px;margin:16px 0 10px}
  .sg-head .ic{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .sg-head .ic i{width:15px;height:15px}
  .sg-head .nm{font-size:13.5px;font-weight:700}
  .sg-head .badge{font-size:11px;color:var(--text-mute)}
  .sg-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .scene-card{border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;transition:.16s;background:var(--panel);display:flex;gap:10px;align-items:flex-start}
  .scene-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--glow-soft)}
  .scene-card .ci{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:15px}
  .scene-card .ci i{width:15px;height:15px}
  .scene-card .ct{font-size:13px;font-weight:600;margin-bottom:2px}
  .scene-card .cp{font-size:11.5px;color:var(--text-mute);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  @media(max-width:640px){.sg-grid{grid-template-columns:1fr}.agent-seg{flex-direction:column}}
  .typing-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary);margin:0 1px;animation:breathe 1.2s infinite}
</style>
<script src="assets/js/lucide.min.js"></script>
</head>
<body data-theme="dark" data-page="ai-workbench">
<main class="wuda-view">
  <div class="page-head">
    <div><div class="page-title"><span class="accentbar"></span><span id="pageTitle">三大AI智能体</span></div>
    <div class="page-sub">AI产业研究院 · AI技术经理人 · AI投资人 —— 基于统一数据底座的对话式智能体，让产业研判与成果转化「可用」</div></div>
    <div style="display:flex;gap:9px">
      <button class="btn btn-sm" id="btnScenes"><i data-lucide="sparkles"></i> 演示场景库</button>
    </div>
  </div>

  <div class="chat-wrap">
    <!-- 顶部:三大智能体切换 -->
    <div class="agent-seg" id="agentSeg"></div>

    <!-- 对话作业区(单一主体) -->
    <div class="panel" style="display:flex;flex-direction:column;padding:14px 16px">
      <div class="panel-h" style="margin-bottom:10px"><div class="t"><span class="bar"></span><span id="chatTitle">对话作业区</span></div>
        <div class="tools"><span class="panel-tag" id="chatStatus">● 就绪</span><span class="panel-tag pointer" id="btnClear">清空对话</span></div></div>
      <div class="chat-box">
        <div class="chat-scroll" id="chatScroll"></div>
        <!-- 输入框上方的演示场景指引 chips -->
        <div id="sceneRail" style="display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 2px"></div>
        <div class="composer">
          <textarea id="composerInput" placeholder="向当前智能体提问或下达任务..."></textarea>
          <div class="flex justify-between items-center mt-2">
            <span class="f12 text-mute"><i data-lucide="database"></i> <span id="srcLine"></span></span>
            <button class="btn btn-primary btn-sm" id="btnSend">⏎ 发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="srcFoot" style="max-width:880px;margin:14px auto 0"></div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/shell.js"></script>
<script>
(function(){
  const D=DB, ri=D.util.ri, pick=D.util.pick, picks=D.util.picks;

  // ====== 三大智能体定义 ======
  // role 参数: research=产业研究院 / tech=技术经理人 / invest=投资人
  const AGENTS = {
    research:{
      key:'AI产业研究院', icon:'<i data-lucide="brain"></i>', color:'var(--primary)',
      eyebrow:'WUHAN UNIVERSITY · AI INDUSTRY RESEARCH INSTITUTE',
      summary:'把每一位科学家，配一个全天候的「AI 版产业研究院」',
      desc:'向研究院提问，它基于学校成果、参股企业、产业图谱与政策数据实时研判，并可一键生成结构化产出（产业报告 / 赛道清单 / 企业画像）。',
      sources:['产业企业与园区','成果与专利','政策与赛道','活动与赛事'],
      // 原 brain-* 独立页 现作为对话演示场景
      scenes:[
        {icon:'trending-up', label:'产业趋势研判', prompt:'分析「具身智能与人形机器人」未来三年产业趋势，并给出武大布局建议。'},
        {icon:'test-tube',   label:'技术路线分析', prompt:'对「硅基光电子集成」做技术路线分析，评估各环节 TRL 与关键瓶颈。'},
        {icon:'target',      label:'赛道选择',     prompt:'综合市场规模、增速与武大契合度，帮我选出最值得重点布局的 TOP3 赛道。'},
        {icon:'building-2',  label:'企业识别',     prompt:'识别「AI大模型与智能体」赛道湖北区域的高契合目标企业清单。'},
        {icon:'scale',       label:'技术项目评估', prompt:'评估「合成生物」方向一项成果的立项价值、市场空间与转化风险。'},
        {icon:'landmark',    label:'政策动态',     prompt:'梳理近期与我校优势学科相关的政策动态及可申报窗口。'},
      ],
      gen:genResearch,
    },
    tech:{
      key:'AI技术经理人', icon:'<i data-lucide="microscope"></i>', color:'var(--accent)',
      eyebrow:'WUHAN UNIVERSITY · AI TECHNOLOGY MANAGER',
      summary:'把每一项成果，配一位全天候的「AI 技术经理人」',
      desc:'负责科技成果转化：成果推广、转化路径设计、概念验证与材料准备，并承接园区企业的梯度培育托管。',
      sources:['成果与专利','学院与团队','参股/校属企业','园区与企业'],
      scenes:[
        {icon:'rocket',      label:'科技成果转化', prompt:'为一项「创新药与合成生物」成果设计完整的科技成果转化方案。'},
        {icon:'megaphone',   label:'成果推广',     prompt:'帮我生成这项成果的推介卡片(成果推荐书)，辐射潜在合作企业。'},
        {icon:'route',       label:'路径设计',     prompt:'为该成果设计从概念验证到产业化的转化路径与里程碑。'},
        {icon:'flask-conical',label:'概念验证',    prompt:'规划该成果的概念验证(PoC)方案，明确验证目标、场景与样机指标。'},
        {icon:'layers',      label:'企业梯度培育', prompt:'为园区一家成长期企业制定梯度培育(专精特新→瞪羚→单项冠军)托管路径。'},
      ],
      gen:genTech,
    },
    invest:{
      key:'AI投资人', icon:'<i data-lucide="briefcase"></i>', color:'var(--success)',
      eyebrow:'WUHAN UNIVERSITY · AI INVESTOR',
      summary:'把每一次融资，配一位全天候的「AI 投资人」',
      desc:'两类融资辅导：帮老师团队融资(商业计划书 / 亮点提炼 / 对接投资机构)、帮园区企业融资。资产管理公司为被动投资、技术入股股权代持。',
      sources:['成果与专利','参股/校属企业','投资库','产业企业与园区'],
      scenes:[
        {icon:'file-text',   label:'帮老师写BP',   prompt:'帮一位老师的科研成果撰写商业计划书(BP)要点，突出技术亮点与融资诉求。'},
        {icon:'sparkles',    label:'亮点提炼',     prompt:'从投资人视角提炼这项成果/项目的核心亮点，便于路演展示。'},
        {icon:'handshake',   label:'对接投资机构', prompt:'根据该项目的赛道与轮次，从投资库推荐匹配的投资机构与投资人。'},
        {icon:'building',    label:'帮园区企业融资', prompt:'为园区一家成长期企业做融资辅导，给出估值区间与对接建议。'},
      ],
      gen:genInvest,
    },
  };
  const PARAM2KEY={research:'research', tech:'tech', invest:'invest'};

  // 读取 ?role= 参数
  function readRole(){
    const p=new URLSearchParams(location.search).get('role');
    return (p&&AGENTS[p])?p:'research';
  }
  let current=readRole();
  let busy=false;

  // 热门提示词(跨三大智能体精选，{role, i} 指向各自 scenes)
  const HOT_PROMPTS=[
    {role:'research', i:0}, // 产业趋势研判
    {role:'tech',     i:0}, // 科技成果转化
    {role:'invest',   i:0}, // 帮老师写BP
    {role:'research', i:2}, // 赛道选择
    {role:'invest',   i:2}, // 对接投资机构
  ];

  // ====== 产出文本生成器(结构化，底层复用 DB) ======
  function genResearch(topic){
    const trk = D.tracks[ri(0,D.tracks.length-1)];
    const t2  = D.tracks[ri(0,D.tracks.length-1)];
    const tgts = picks(D.targetEnterprises, 4);
    const pol = D.policyEvents[ri(0,D.policyEvents.length-1)];
    const body =
`【产业研判 · ${topic}】\n`+
`一、总体判断\n`+
`• 该方向当前处于「${trk.stage}」，市场规模约 ${trk.market} 亿元，近一年增速 ${trk.growth}%，产业热度 ${trk.heat}。\n`+
`• 武大学科契合度 ${trk.fit} 分，已集聚相关企业 ${trk.ents} 家，具备从成果到产业的牵引基础。\n`+
`• 建议沿「核心零部件 + 行业大模型 + 中试场景」三条线协同布局。\n\n`+
`二、热点赛道清单(TOP)\n`+
`① ${trk.name} — 契合 ${trk.fit} / 增速 ${trk.growth}% / 阶段 ${trk.stage}\n`+
`② ${t2.name} — 契合 ${t2.fit} / 增速 ${t2.growth}% / 阶段 ${t2.stage}\n`+
`③ 关联衍生(中试装备 / 数据服务 / 检测认证)具备配套机会。\n\n`+
`三、区域目标企业清单\n`+
tgts.map((e,i)=>`${i+1}. ${e.name}｜${e.discName}｜匹配度 ${e.match}｜${e.city}｜${e.type}`).join('\n')+`\n\n`+
`四、政策动态\n`+
`• 相关政策：《${pol.title}》(${pol.level}/${pol.status})，匹配度 ${pol.match}，可关注申报窗口 ${pol.deadline}。\n\n`+
`五、行动建议\n`+
`• 优先启动 ${tgts[0].name} 的招商对接，由技术经理人配合输出成果匹配方案;\n`+
`• 将 ${trk.name} 列入学校重点布局赛道，组织专题对接会;\n`+
`• 可交付：产业报告(PDF) + 赛道清单(表) + 目标企业清单(表)。`;
    return {body, value:(2.4+Math.random()*1.2).toFixed(1), billing:'产业报告', dur:ri(3,9)+'分钟',
      scope:`产业报告 / 赛道清单 / 目标企业清单 · ${topic}`};
  }
  function genTech(topic){
    const a = D.achievements[ri(0,D.achievements.length-1)];
    const a2 = D.achievements[ri(0,D.achievements.length-1)];
    const body =
`【科技成果转化方案 · ${topic}】\n`+
`一、成果画像\n`+
`• 代表成果：《${a.title}》(${a.disciplineName}/${a.college})\n`+
`• 负责人：${a.leader}｜TRL ${a.trl}｜专利 ${a.patents} 项｜论文 ${a.papers} 篇｜成熟度 ${a.maturity}\n`+
`• 应用场景：${a.scenes.join('、')}｜估值参考 ${a.value} 万元｜场景匹配 ${a.match}\n\n`+
`二、成果推广(成果推荐书要点)\n`+
`• 一句话：用「${a.title}」解决${a.scenes[0]}场景的关键瓶颈;\n`+
`• 适配企业：基于产业图谱推荐潜在合作企业，标注联系状态(已联系/已对接/已合作);\n`+
`• 关联成果：可与《${a2.title}》形成技术互补，打包推广。\n\n`+
`三、转化路径设计(里程碑)\n`+
`① 概念验证(0-3月)：完成中试样机/小试验证，锁定首批场景客户;\n`+
`② 项目立项(3-6月)：成立项目公司，引入天使轮，申请专利布局;\n`+
`③ 中试放大(6-12月)：入驻加速器，完成产线小批量;\n`+
`④ 产业化(12月+)：规模量产 + 投融资协同放大。\n\n`+
`四、概念验证(PoC)\n`+
`• 验证目标：核心指标达到产业可用阈值;\n`+
`• 验证场景：${a.scenes[0]}，引入种子客户共建;\n`+
`• 材料准备：技术白皮书 + PoC 报告 + 推介卡片。\n\n`+
`五、园区企业梯度培育(可托管)\n`+
`• 路径：科技型中小企业 → 专精特新 → 瞪羚 → 单项冠军;\n`+
`• 与服务广场「企业梯度培育」智能体共用模块，纳入托管清单。\n`+
`可交付：成果画像 + 推介卡片 + 转化路径 + PoC 方案。`;
    return {body, value:(0.8+Math.random()*1.0).toFixed(1), billing:'转化服务', dur:ri(4,12)+'分钟',
      scope:`成果画像 / 推介卡片 / 转化路径 · ${a.title}`};
  }
  function genInvest(topic){
    const cands = D.enterprises.filter(e=>e.equity>0);
    const e = cands.length?cands[ri(0,cands.length-1)]:D.enterprises[ri(0,D.enterprises.length-1)];
    const a = D.achievements[ri(0,D.achievements.length-1)];
    const low = Math.round(e.valuation*0.78), high=Math.round(e.valuation*1.22);
    const investors=['光谷创投','东湖资本','武大科创基金','中科创星','深创投','湖北高投','达晨财智'];
    const body =
`【融资辅导方案 · ${topic||e.name}】\n`+
`一、服务对象与目标\n`+
`• 两类对象：① 科研老师团队(成果融资) ② 园区企业(成长融资);\n`+
`• 本方案围绕「${a.disciplineName}」方向项目，目标完成早期融资对接。\n\n`+
`二、商业计划书(BP)要点\n`+
`• 痛点：${a.disciplineName}行业核心环节存在性能/成本瓶颈;\n`+
`• 方案：基于成果《${a.title}》核心专利构建产品化方案，形成差异化壁垒;\n`+
`• 数据亮点：TRL ${a.trl}、专利 ${a.patents} 项、估值参考 ${a.value} 万、匹配度 ${a.match};\n`+
`• 团队：${a.leader} 领衔，具备工程化与产业化经验。\n\n`+
`三、亮点提炼(投资人视角)\n`+
`• 技术稀缺性 + 场景确定性 + 团队执行力构成核心叙事;\n`+
`• 一句话路演：用「${a.title}」切入${a.scenes[0]}，做该环节的关键供给方。\n\n`+
`四、估值与融资诉求\n`+
`• 参考标的：${e.name}(${e.stage}/${e.financingRound})，账面估值 ${e.valuation.toLocaleString()} 万;\n`+
`• 合理区间(可比法+收益法)：${low.toLocaleString()} ~ ${high.toLocaleString()} 万;\n`+
`• 建议本轮：天使轮 ${ri(500,2000)} 万，用于中试与团队。\n\n`+
`五、对接投资机构(投资库)\n`+
picks(investors,3).map((iv,i)=>`${i+1}. ${iv} — 关注${a.disciplineName}早期项目，建议优先沟通`).join('\n')+`\n\n`+
`说明：资产管理公司为被动投资、技术入股股权代持，不做主动投资。\n`+
`可交付：BP 要点 + 亮点提炼 + 估值区间 + 投资机构对接清单。`;
    return {body, value:(1.5+Math.random()*1.5).toFixed(1), billing:'融资辅导', dur:ri(5,14)+'分钟',
      scope:`BP要点 / 亮点提炼 / 估值区间 / 机构对接 · ${e.name}`};
  }

  // ====== 渲染:顶部三大智能体分段切换 ======
  function renderAgentSeg(){
    document.getElementById('agentSeg').innerHTML = Object.keys(AGENTS).map(k=>{
      const a=AGENTS[k], on=k===current;
      return `<div class="seg-pill ${on?'on':''}" data-role="${k}" style="--seg:${a.color}">
        <span class="ic" style="background:color-mix(in srgb,${a.color} 18%,transparent);color:${a.color}">${a.icon}</span>
        <span>${a.key}</span></div>`;
    }).join('');
    document.querySelectorAll('#agentSeg .seg-pill').forEach(el=>el.onclick=()=>switchAgent(el.dataset.role));
  }
  // ====== 渲染:输入框上方场景 chips + 数据域 ======
  function renderScenes(){
    const a=AGENTS[current];
    document.getElementById('sceneRail').innerHTML = `<span class="text-mute f12" style="align-self:center">试试：</span>`+
      a.scenes.slice(0,4).map((s,i)=>`<span class="scene-chip" data-scene="${i}"><i data-lucide="${s.icon}"></i>${s.label}</span>`).join('');
    document.querySelectorAll('#sceneRail .scene-chip').forEach(el=>el.onclick=()=>fillScene(+el.dataset.scene));
    document.getElementById('srcLine').textContent = '已接入：'+a.sources.join(' · ');
  }
  // 演示场景 → 填入对话框(当前智能体)
  function fillScene(i){
    const a=AGENTS[current], s=a.scenes[i]; if(!s) return;
    const ta=document.getElementById('composerInput');
    ta.value=s.prompt; ta.focus();
  }
  // 跨智能体场景 → 切到对应智能体并填入(欢迎页卡片/热门提示词)
  function goScene(k,i){
    if(busy){ UI.toast('生成进行中，请稍候','warn'); return; }
    if(k!==current) switchAgent(k);
    fillScene(i);
  }

  // ====== 切换智能体 ======
  function switchAgent(k){
    if(busy){ UI.toast('生成进行中，请稍候','warn'); return; }
    if(k===current) return;
    current=k;
    // 同步 URL ?role=
    const u=new URL(location.href); u.searchParams.set('role',k); history.replaceState(null,'',u);
    syncAgent();
    UI.toast('已切换为 '+AGENTS[k].key,'ok');
  }
  function syncAgent(){
    const a=AGENTS[current];
    document.getElementById('pageTitle').textContent=a.key;
    document.getElementById('chatTitle').textContent=a.key+' · 对话作业区';
    document.getElementById('composerInput').placeholder='向「'+a.key+'」提问或下达任务，例如点击场景卡片...';
    renderAgentSeg(); renderScenes(); resetChat();
    if(window.lucide) lucide.createIcons();
  }

  // ====== 对话区(复用打字机/气泡逻辑) ======
  const scroll=()=>{const s=document.getElementById('chatScroll'); s.scrollTop=s.scrollHeight;};
  function pushUser(text){
    const s=document.getElementById('chatScroll');
    const div=document.createElement('div'); div.className='msg me';
    div.innerHTML=`<div class="av"><i data-lucide="user"></i></div><div class="bubble">${UI.esc(text)}</div>`;
    s.appendChild(div); if(window.lucide) lucide.createIcons(); scroll();
  }
  function pushAI(html){
    const s=document.getElementById('chatScroll');
    const a=AGENTS[current];
    const div=document.createElement('div'); div.className='msg ai';
    div.innerHTML=`<div class="av">${a.icon}</div><div class="bubble">${html}</div>`;
    s.appendChild(div); if(window.lucide) lucide.createIcons(); scroll();
    return div.querySelector('.bubble');
  }
  // ====== 欢迎 / 空状态(热门提示词 + 按智能体分组的推荐场景) ======
  function welcomeHTML(){
    const a=AGENTS[current];
    const hot=HOT_PROMPTS.map((h,idx)=>{
      const ag=AGENTS[h.role], s=ag.scenes[h.i]; if(!s) return '';
      return `<span class="hot-chip" data-hot="${idx}"><i data-lucide="flame" class="fire"></i>${s.label}<span class="who">· ${ag.key}</span></span>`;
    }).join('');
    const order=[current, ...Object.keys(AGENTS).filter(k=>k!==current)];
    const groups=order.map(k=>{
      const ag=AGENTS[k];
      const cards=ag.scenes.map((s,i)=>
        `<div class="scene-card" data-go="${k}" data-i="${i}">
          <div class="ci" style="background:color-mix(in srgb,${ag.color} 16%,transparent);color:${ag.color}"><i data-lucide="${s.icon}"></i></div>
          <div style="min-width:0"><div class="ct">${s.label}</div><div class="cp">${UI.esc(s.prompt)}</div></div>
        </div>`).join('');
      return `<div class="scene-group">
        <div class="sg-head">
          <div class="ic" style="background:color-mix(in srgb,${ag.color} 16%,transparent);color:${ag.color}">${ag.icon}</div>
          <div class="nm">${ag.key}</div><div class="badge">${ag.scenes.length} 个场景</div>
          ${k===current?'<span class="light g" style="margin-left:auto"><span class="o"></span>当前</span>':''}
        </div>
        <div class="sg-grid">${cards}</div>
      </div>`;
    }).join('');
    return `<div class="welcome">
      <div class="wc-top">
        <div class="wc-ava" style="background:color-mix(in srgb,${a.color} 18%,transparent);color:${a.color}">${a.icon}</div>
        <div class="wc-sum">${a.summary}</div>
        <div class="wc-desc">${UI.esc(a.desc)}</div>
      </div>
      <div class="wc-label">热门提示词</div>
      <div class="hot-rail">${hot}</div>
      <div class="wc-label">推荐场景 · 点击卡片即可开始</div>
      ${groups}
    </div>`;
  }
  function bindWelcome(){
    document.querySelectorAll('#chatScroll .hot-chip').forEach(el=>el.onclick=()=>{
      const h=HOT_PROMPTS[+el.dataset.hot]; goScene(h.role, h.i);
    });
    document.querySelectorAll('#chatScroll .scene-card').forEach(el=>el.onclick=()=>{
      goScene(el.dataset.go, +el.dataset.i);
    });
  }
  function resetChat(){
    const sc=document.getElementById('chatScroll');
    sc.innerHTML=welcomeHTML();
    bindWelcome();
    if(window.lucide) lucide.createIcons();
  }
  // 首次发言前清掉欢迎页，进入会话态
  function ensureConversation(){
    const sc=document.getElementById('chatScroll');
    if(sc.querySelector('.welcome')) sc.innerHTML='';
  }

  // ====== 发送 / 流式生成 ======
  function send(){
    if(busy) return;
    const ta=document.getElementById('composerInput');
    let text=ta.value.trim();
    if(!text){ UI.toast('请输入提问或任务指令','warn'); return; }
    ta.value='';
    runPrompt(text);
  }
  function runPrompt(text){
    if(busy) return;
    ensureConversation();
    pushUser(text);
    busy=true;
    document.getElementById('chatStatus').innerHTML='<span class="typing-dot"></span><span class="typing-dot" style="animation-delay:.2s"></span><span class="typing-dot" style="animation-delay:.4s"></span> 生成中';
    document.getElementById('btnSend').disabled=true;

    const a=AGENTS[current];
    const result = a.gen(text);
    const meta = `<div class="f12 text-mute mb-2"><i data-lucide="link"></i> 已调度数据域：${a.sources.join(' · ')}</div>`;
    const bubble = pushAI(meta+'<div class="gen-out" id="liveOut"></div>');
    const target = bubble.querySelector('#liveOut');
    target.id='';

    UI.typewriter(target, result.body, {speed:9, onDone:()=>{
      target.innerHTML = target.innerHTML
        .replace(/【([^】]+)】/g,'【<b>$1</b>】')
        .replace(/(一、|二、|三、|四、|五、)/g,'<b>$1</b>');
      appendDeliver(bubble, result, text);
      busy=false;
      document.getElementById('chatStatus').innerHTML='● 就绪';
      document.getElementById('btnSend').disabled=false;
      scroll();
      UI.toast('已生成','ok');
    }});
  }
  // ====== 气泡内:交付 meta + 消息操作栏(复制 / 导出 / 重新生成) ======
  function appendDeliver(bubble, result, text){
    const wrap=document.createElement('div');
    wrap.innerHTML=
      `<div class="deliver-meta">
         <span><i data-lucide="package-check"></i>交付：${UI.esc(result.scope)}</span>
         <span><i data-lucide="clock"></i>耗时 ${result.dur}</span>
         <span><i data-lucide="gem"></i>参考价值 ${result.value} 万</span>
       </div>
       <div class="msg-actions">
         <span class="msg-act" data-act="copy"><i data-lucide="copy"></i>复制</span>
         <span class="msg-act" data-act="export"><i data-lucide="download"></i>导出</span>
         <span class="msg-act" data-act="regen"><i data-lucide="refresh-cw"></i>重新生成</span>
       </div>`;
    bubble.appendChild(wrap);
    if(window.lucide) lucide.createIcons();
    wrap.querySelector('[data-act="copy"]').onclick=()=>{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(result.body).then(()=>UI.toast('已复制交付内容','ok'),()=>UI.toast('复制失败','warn'));
      } else { UI.toast('当前环境不支持复制','warn'); }
    };
    wrap.querySelector('[data-act="export"]').onclick=()=>UI.toast('产出物已导出(PDF)','ok');
    wrap.querySelector('[data-act="regen"]').onclick=()=>{ if(busy){UI.toast('生成中，请稍候','warn');return;} runPrompt(text); };
  }

  // ====== 演示场景库 抽屉 ======
  document.getElementById('btnScenes').onclick=()=>{
    let html='';
    Object.keys(AGENTS).forEach(k=>{
      const a=AGENTS[k];
      html+=`<div class="panel-h" style="margin-top:8px"><div class="t"><span class="bar"></span>${a.icon} ${a.key}</div></div>`;
      html+=a.scenes.map((s,i)=>`<div class="scene-side" style="cursor:pointer" data-go="${k}" data-i="${i}"><i data-lucide="${s.icon}"></i> ${s.label} → ${UI.esc(s.prompt)}</div>`).join('');
    });
    UI.drawer('演示场景库', html, {width:'600px'});
    document.querySelectorAll('.drawer .scene-side[data-go]').forEach(el=>el.onclick=()=>{
      UI.closeDrawer();
      goScene(el.dataset.go, +el.dataset.i);
    });
  };

  // ====== 绑定 ======
  document.getElementById('btnSend').onclick=send;
  document.getElementById('btnClear').onclick=()=>{ if(busy){UI.toast('生成中无法清空','warn');return;} resetChat(); };
  document.getElementById('composerInput').addEventListener('keydown',e=>{
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); send(); }
  });

  // ====== 初始化 ======
  syncAgent();
  document.getElementById('srcFoot').innerHTML=UI.srcNote(['成果与专利','参股/校属企业','产业企业与园区','政策与赛道','投资库']);
  if(window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
